# Local dev stack — the whole platform on your machine, no Cloudflare, no AWS.
# Expects the app repos checked out as siblings of hamdy-infra (the workspace
# layout). Run from this directory:
#
#   docker compose -f docker-compose.dev.yml up -d --build
#
# Then open http://hamdy.localhost, http://s.localhost, http://paste.localhost

name: hamdy-platform-dev

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./Caddyfile.dev:/etc/caddy/Caddyfile:ro
    networks:
      - web

  hamdy-app:
    build: ../../hamdy-app
    restart: unless-stopped
    networks:
      - web

  shortener-frontend:
    build: ../../shortener-frontend
    restart: unless-stopped
    networks:
      - web

  shortener-backend:
    build: ../../shortener-backend
    restart: unless-stopped
    environment:
      # DynamoDB Local stand-in for AWS — any non-empty credentials work
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_REGION: eu-central-1
      DYNAMODB_ENDPOINT: http://dynamodb-local:8000
      SHORTENER_ADMIN_TOKEN: dev-token
      SHORTENER_PUBLIC_URL: http://s.localhost
    depends_on:
      - dynamodb-local
    networks:
      - web
      - internal

  paste-frontend:
    build: ../../paste-frontend
    restart: unless-stopped
    networks:
      - web

  paste-backend:
    build: ../../paste-backend
    restart: unless-stopped
    environment:
      SPRING_CASSANDRA_CONTACT_POINTS: cassandra
      SPRING_CASSANDRA_PORT: "9042"
      SPRING_CASSANDRA_LOCAL_DATACENTER: datacenter1
      SPRING_CASSANDRA_KEYSPACE_NAME: paste
      PASTE_PUBLIC_URL: http://paste.localhost
      PASTE_API_PUBLIC_URL: http://api.paste.localhost
      PASTE_CORS_ORIGINS: http://paste.localhost
    depends_on:
      cassandra:
        condition: service_healthy
    networks:
      - web
      - internal

  # --- datastores (internal only, same as prod) ---

  dynamodb-local:
    image: amazon/dynamodb-local:latest
    restart: unless-stopped
    networks:
      - internal

  cassandra:
    image: cassandra:5
    restart: unless-stopped
    environment:
      CASSANDRA_CLUSTER_NAME: dev
      HEAP_NEWSIZE: 128M
      MAX_HEAP_SIZE: 1G
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe cluster' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 60s
    volumes:
      - cassandra_dev_data:/var/lib/cassandra
    networks:
      - internal

networks:
  web:
  internal:

volumes:
  cassandra_dev_data:
