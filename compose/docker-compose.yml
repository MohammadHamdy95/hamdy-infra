name: hamdy-platform

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - web

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    networks:
      - web

  # --- apps ---
  # Built from source (sibling checkouts, see ../DEPLOY.md) until CI
  # publishes images to GHCR — swap `build:` for `image: ghcr.io/...`
  # once that exists, nothing else here changes.

  hamdy-app:
    build: ../../hamdy-app
    restart: unless-stopped
    networks:
      - web

  tiny-frontend:
    build: ../../tiny-frontend
    restart: unless-stopped
    networks:
      - web

  tiny-backend:
    build: ../../tiny-backend
    restart: unless-stopped
    environment:
      # Narrow IAM user from terraform/aws — NOT your deployer credentials.
      AWS_ACCESS_KEY_ID: ${TINY_AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${TINY_AWS_SECRET_ACCESS_KEY}
      AWS_REGION: us-west-2
      TINY_PUBLIC_URL: https://tiny.hamdy.app
    networks:
      - web
      - internal

  paste-frontend:
    build: ../../paste-frontend
    restart: unless-stopped
    networks:
      - web

  paste-backend:
    build: ../../paste-backend
    restart: unless-stopped
    environment:
      SPRING_CASSANDRA_CONTACT_POINTS: cassandra
      SPRING_CASSANDRA_PORT: "9042"
      SPRING_CASSANDRA_LOCAL_DATACENTER: datacenter1
      SPRING_CASSANDRA_KEYSPACE_NAME: paste
      PASTE_PUBLIC_URL: https://paste.hamdy.app
      PASTE_API_PUBLIC_URL: https://paste.hamdy.app
    depends_on:
      cassandra:
        condition: service_healthy
    networks:
      - web
      - internal

  spec-frontend:
    build: ../../spec-frontend
    restart: unless-stopped
    networks:
      - web

  spec-backend:
    build: ../../spec-backend
    restart: unless-stopped
    environment:
      SPRING_CASSANDRA_CONTACT_POINTS: cassandra
      SPRING_CASSANDRA_PORT: "9042"
      SPRING_CASSANDRA_LOCAL_DATACENTER: datacenter1
      # Its own keyspace: shares the Cassandra node with paste, but not its
      # tables. Two apps in one keyspace would couple their schemas.
      SPRING_CASSANDRA_KEYSPACE_NAME: spec
      SPEC_PUBLIC_URL: https://spec.hamdy.app
    depends_on:
      cassandra:
        condition: service_healthy
    networks:
      - web
      - internal

  # play.hamdy.app — NodeCast TV. Browser front-end for an Xtream Codes /
  # M3U IPTV provider: live TV, EPG, and VOD, transcoding with FFmpeg when a
  # client cannot play the source stream directly.
  #
  # PINNED BY DIGEST, not :latest. ghcr publishes only `latest`, `main` and
  # commit-sha tags for this project — there is no semver tag to track, and
  # `latest` is rebuilt in place, so following it would silently change the
  # running version on every redeploy. The digest below is what `latest`
  # resolved to on 2026-09-04 (release line v2.1.1). To upgrade: re-resolve
  # the digest and change it here, so the version bump is one reviewable
  # commit and a rollback is `git revert`.
  nodecast:
    image: ghcr.io/technomancer702/nodecast-tv@sha256:caf34492517f5a827ca75e8d27d5a9a65155c12671d02ac335060cfc4df151fc
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
    # Resolve DNS directly, bypassing the daemon's list.
    #
    # /etc/docker/daemon.json still has "192.168.1.10" first -- this host's
    # address on the old AT&T LAN, dead since the move to 192.168.50.0/24.
    # Docker's embedded resolver tries it, waits, then falls back to 1.1.1.1,
    # so every container lookup costs ~4s (measured 4026ms here against 31ms
    # on the host).
    #
    # Most services never noticed: they resolve once at startup and hold the
    # connection. This one resolves the IPTV provider repeatedly -- channel
    # lists, EPG pulls, stream probes -- against a 10s client timeout, so the
    # penalty stacked up and requests failed with UND_ERR_CONNECT_TIMEOUT.
    # Channels appeared to "not load".
    #
    # This is a targeted override, not the real fix: daemon.json is the actual
    # bug and every container on the host still pays for it. Correcting it
    # needs a Docker daemon restart, which stops every container, so it wants
    # a maintenance window. Remove this block once that is done.
    dns:
      - 1.1.1.1
      - 1.0.0.1
    volumes:
      # SQLite lives here (users, provider config, favourites, EPG cache), so
      # this volume IS the app's state — everything else is disposable.
      - nodecast_data:/app/data
    # Intel QuickSync. The host is a Core Ultra 9 285K with an integrated GPU,
    # so transcodes land on the iGPU instead of burning cores the rest of the
    # platform needs. group_add is required as well as the device: /dev/dri/
    # renderD128 is root:render (gid 991) and the container does not run as
    # root, so without the group it can see the device but not open it.
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "991"   # render
    # No published port — Caddy reaches it over `web` by service name, like
    # every other app here. It needs outbound access to the IPTV provider,
    # which `web` already allows; it must NOT be on `internal`, which is the
    # datastore-only network.
    networks:
      - web

  # --- datastores (internal network ONLY, never published to host) ---

  cassandra:
    image: cassandra:5
    restart: unless-stopped
    environment:
      CASSANDRA_CLUSTER_NAME: hamdy-platform
      HEAP_NEWSIZE: 128M
      MAX_HEAP_SIZE: 1G
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe cluster' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 60s
    volumes:
      - cassandra_data:/var/lib/cassandra
    networks:
      - internal

networks:
  web:
  internal:

volumes:
  caddy_data:
  caddy_config:
  cassandra_data:
  nodecast_data:
