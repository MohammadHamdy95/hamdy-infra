name: hamdy-platform

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - web

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    networks:
      - web

  # --- apps ---
  # Built from source (sibling checkouts, see ../DEPLOY.md) until CI
  # publishes images to GHCR — swap `build:` for `image: ghcr.io/...`
  # once that exists, nothing else here changes.

  hamdy-app:
    build: ../../hamdy-app
    restart: unless-stopped
    networks:
      - web

  tiny-frontend:
    build: ../../tiny-frontend
    restart: unless-stopped
    networks:
      - web

  tiny-backend:
    build: ../../tiny-backend
    restart: unless-stopped
    environment:
      # Narrow IAM user from terraform/aws — NOT your deployer credentials.
      AWS_ACCESS_KEY_ID: ${TINY_AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${TINY_AWS_SECRET_ACCESS_KEY}
      AWS_REGION: us-west-2
      TINY_PUBLIC_URL: https://tiny.hamdy.app
    networks:
      - web
      - internal

  paste-frontend:
    build: ../../paste-frontend
    restart: unless-stopped
    networks:
      - web

  paste-backend:
    build: ../../paste-backend
    restart: unless-stopped
    environment:
      SPRING_CASSANDRA_CONTACT_POINTS: cassandra
      SPRING_CASSANDRA_PORT: "9042"
      SPRING_CASSANDRA_LOCAL_DATACENTER: datacenter1
      SPRING_CASSANDRA_KEYSPACE_NAME: paste
      PASTE_PUBLIC_URL: https://paste.hamdy.app
      PASTE_API_PUBLIC_URL: https://paste.hamdy.app
    depends_on:
      cassandra:
        condition: service_healthy
    networks:
      - web
      - internal

  # --- datastores (internal network ONLY, never published to host) ---

  cassandra:
    image: cassandra:5
    restart: unless-stopped
    environment:
      CASSANDRA_CLUSTER_NAME: hamdy-platform
      HEAP_NEWSIZE: 128M
      MAX_HEAP_SIZE: 1G
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe cluster' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 60s
    volumes:
      - cassandra_data:/var/lib/cassandra
    networks:
      - internal

networks:
  web:
  internal:

volumes:
  caddy_data:
  caddy_config:
  cassandra_data:
